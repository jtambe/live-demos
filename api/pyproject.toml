[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
dependencies = [ "fastapi>=0.100.0", "uvicorn>=0.24.0", "supabase>=2.31.0", "python-dotenv>=1.0.0", "pydantic>=2.11.0", "pydantic-settings>=2.0.0", "pandas>=2.0.0", "python-multipart>=0.0.6" ]
requires-python = "~=3.14.0"

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "pytest-cov>=4.1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["routers", "services", "utils"]
exclude = ["tests*", "build*", "*.egg-info"]
